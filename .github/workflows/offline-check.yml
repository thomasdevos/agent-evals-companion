name: Offline check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-offline:
    name: check_offline.py
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Show the interpreter
        run: |
          python3 --version
          python3 -c "import sqlite3; print(sqlite3.sqlite_version)"

      - name: Run the offline check
        run: python3 tools/check_offline.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
